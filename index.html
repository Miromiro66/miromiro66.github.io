<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sprytne Dzieci | Portal Edukacyjny</title>
    <style>
        /* Tu zaczynamy nasz własny styl (CSS) */
        body {
            background-color: #05070a; /* Bardzo ciemny granat */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Nagłówek strony */
        header {
            padding: 50px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 50px;
            margin: 0;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Kontener na nasze gry (siatka) */
        .siatka-gier {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
        }

        /* Wygląd pojedynczego kafleka gry */
        .kafel-gry {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.4s; /* Płynność ruchu */
        }

        /* Co się dzieje, gdy najedziesz myszką/palcem */
        .kafel-gry:hover {
            background: rgba(79, 172, 254, 0.1);
            border-color: #4facfe;
            transform: translateY(-10px); /* Kafel się unosi */
        }

        .ikona {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }

        .tytul-gry {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .opis {
            font-size: 14px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sprytne Dzieci</h1>
        <p>Twoje centrum kosmicznych gier i nauki</p>
    </header>

    <div class="siatka-gier">
        
        <a href="https://miromiro66.github.io/Matematyka-dla-dzieci-dodawanie-odejmowanie/" class="kafel-gry">
            <span class="ikona">👽</span>
            <div class="tytul-gry">Matematyka</div>
            <div class="opis">Misja: Dodawanie i Odejmowanie</div>
        </a>

        <a href="https://miromiro66.github.io/Nauka-Godzin-Dla-Dzieci/" class="kafel-gry">
            <span class="ikona">🕒</span>
            <div class="tytul-gry">Zegary</div>
            <div class="opis">Misja: Opanuj czas w galaktyce</div>
        </a>

        <a href="https://miromiro66.github.io/Matematyka-Kosmiczna/" class="kafel-gry">
            <span class="ikona">☄️</span>
            <div class="tytul-gry">Kosmiczna Matma</div>
            <div class="opis">Misja: Wyzwanie Astronauty</div>
        </a>

    </div>

    <footer style="margin-top: 50px; padding: 20px; color: #444;">
        &copy; 2026 SprytneDzieci.eu | Tworzymy przyszłość
    </footer>

</body>
</html>
